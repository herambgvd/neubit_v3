# SonarQube analysis for the neubit_v3 monorepo.
#
# ONE PROJECT, NOT SEVEN. Sonar's own guidance is a project per module, and it is
# wrong for this repo: the services are one deployable console that share a kernel,
# a permission vocabulary and a frontend, and the findings that matter here —
# duplicated logic across services, a permission string that drifts from the screen
# that gates on it — are invisible from inside a single service. Split later if a
# service is ever released on its own.
sonar.projectKey=neubit
sonar.projectName=neubit_v3
sonar.sourceEncoding=UTF-8

# ── what is analysed ─────────────────────────────────────────────────────────
# The generated and vendored trees are left out by exclusion rather than by
# omitting them here, so a new service directory is picked up automatically
# instead of being silently unanalysed until somebody remembers this file.
sonar.sources=backend,frontend/src,admin-frontend/src,e2e
sonar.tests=backend/core/tests,backend/vision/tests,backend/access/tests,backend/ingest/tests,backend/workflow/tests,backend/reading-writer/tests

# Test code under sonar.sources would be reported as production issues; naming the
# test roots above is what stops that. The frontend colocates its tests beside the
# code, so they are marked by pattern instead.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/test_*.py,**/*_test.py

sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/*.min.js,\
  **/public/**,\
  **/migrations/versions/**,\
  frontend/src/lib/icons*.ts

# Migrations are excluded on purpose and it is worth saying why: an applied
# migration is history. Sonar's advice on one is "refactor", and refactoring a
# migration that has already run on a production database is how a schema stops
# matching its own record of itself.

# ── duplication ──────────────────────────────────────────────────────────────
# `src/test/pydantic.ts` exists in BOTH consoles and the copy is deliberate: they
# are separate npm packages with separate Docker build contexts, so a cross-app
# import breaks `next build`. Copying it was the choice; the risk is drift, and
# that is now a TEST (admin-frontend/src/test/pydantic.test.ts reads the canonical
# file off disk — `fs`, not an import, so nothing is bundled — and fails when the
# two stop matching).
#
# Excluded from CPD because the measurement is the thing that is wrong here, not
# the code: a duplicate held in step by a guard is not the defect the metric is
# looking for, and leaving it in makes the number stop meaning anything.
sonar.cpd.exclusions=\
  **/src/test/pydantic.ts,\
  **/migrations/env.py,\
  **/migrations/versions/**,\
  **/tests/conftest.py

# migrations/env.py is alembic's own generated bootstrap, four times over — not
# ours to deduplicate, and rewriting it would break the tool that owns it.
#
# migrations/versions/** is HISTORY. A migration and the one that later reverses
# it necessarily describe the same table twice; that is what a reversal IS. The
# only way to "deduplicate" applied migrations is to rewrite a record of what has
# already run on production databases, which is the one thing a migration must
# never be.
#
# tests/conftest.py is one per service, and each is the entry point to its own
# suite: same kernel, same pattern, therefore similar. Sharing them would mean a
# test package installed into six throwaway images to save a bootstrap nobody
# reads twice.

# ── coverage ─────────────────────────────────────────────────────────────────
# Produced by the test runners, not by the scanner. Without these the analyser
# reports 0% — which is indistinguishable from having no tests at all, and is what
# failed the quality gate while ~4,000 of them were passing.
#
#   frontend   npx vitest run --coverage      (in frontend/ AND admin-frontend/)
#   backend    ./backend/<svc>/run-tests.sh --coverage      (one XML per service)
#
# A path here that no run produces would report 0% for that service forever, so
# every one of these is generated by a command in this repo and nothing is listed
# speculatively.
sonar.javascript.lcov.reportPaths=\
  frontend/coverage/lcov.info,\
  admin-frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=\
  backend/core/coverage/coverage.xml,\
  backend/vision/coverage/coverage.xml,\
  backend/access/coverage/coverage.xml,\
  backend/ingest/coverage/coverage.xml,\
  backend/workflow/coverage/coverage.xml,\
  backend/reading-writer/coverage/coverage.xml

sonar.python.version=3.11
