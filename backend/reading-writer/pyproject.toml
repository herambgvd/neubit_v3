[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neubit-reading-writer"
version = "0.1.0"
description = "Reading-writer — the only writer of the readings hypertable. Durable queue-group JetStream consumer, batched idempotent upserts into neubit_reporting."
requires-python = ">=3.11"

dependencies = [
    "kernel",             # shared config/db/events (path dep)
    "neubit-reporting",   # the SCHEMA — Point/Reading are imported, never redeclared
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "nats-py>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Registering each dataset's permission with core, so a ROLE CAN GRANT IT.
    # See app/api/permsync.py — best-effort, service-to-service, never on a read path.
    "httpx>=0.27",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
kernel = { path = "/opt/kernel", editable = true }
neubit-reporting = { path = "/opt/reporting", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
