[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neubit-dashforge"
version = "0.1.0"
description = "DashForge embed registry — which DashForge dashboards this platform shows, and the gated per-session mint of their embed tokens."
requires-python = ">=3.11"

dependencies = [
    "kernel",          # shared kernel (path dep — see [tool.uv.sources])
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # The DashForge peer is reached over HTTP; same client every other satellite
    # uses for a peer call (vision's federation client, reading-writer's permsync).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
kernel = { path = "/opt/kernel", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
