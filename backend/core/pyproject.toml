[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neubit-core"
version = "0.1.0"
description = "Reusable edge/inference core for single-tenant CV scenario apps (FRS, ANPR, ...)"
requires-python = ">=3.11"

# --- Core deps: needed by every scenario app -------------------------------
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",          # async Postgres driver
    "alembic>=1.13",          # DB migrations
    "pyjwt[crypto]>=2.8",     # app-auth JWTs AND license verification (EdDSA)
    "cryptography>=42.0",     # Ed25519 keys for licensing
    "argon2-cffi>=23.0",      # password hashing (argon2id — OWASP default)
    "email-validator>=2.1",   # EmailStr validation
    "python-multipart>=0.0.9",  # multipart/form-data (file uploads, e.g. branding logo)
    "prometheus-client>=0.20",  # /metrics endpoint
    "httpx>=0.27",
    "nats-py>=2.6",
]

[project.optional-dependencies]
# Install per scenario depending on what it needs — keeps deploys lean.
# Self-contained GPU stack (do NOT combine with `runtime` — onnxruntime and
# onnxruntime-gpu provide the same package and conflict). Includes numpy/opencv
# so the GPU image installs [...,vector,gpu] without needing `runtime`.
storage   = ["aioboto3>=13.0"]            # only when storage_backend=s3
messaging = ["aiosmtplib>=3.0", "jinja2>=3.1"]
tasks     = ["celery>=5.3", "redis>=5.0", "psycopg2-binary>=2.9"]  # sync DB driver for workers/streams
reports   = ["openpyxl>=3.1", "reportlab>=4.0"]
system    = ["psutil>=5.9"]
# Floor-plan conversion (sites module): PDF→PNG needs poppler-utils (system dep);
# DXF→SVG needs ezdxf + matplotlib. All imported LAZILY so the core boots without
# them — install this extra only where floor-plan upload is used.
sites     = ["pdf2image>=1.17", "ezdxf>=1.1", "matplotlib>=3.8", "Pillow>=10.0"]
# Live LDAP/AD directory sync + bind (security module). Imported lazily so core
# boots without it; install where directory login/sync is used. LIVE-VALIDATE.
directory = ["ldap3>=2.9"]
dev       = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# --continue-on-collection-errors is a BLAST-RADIUS LIMIT, not a convenience.
#
# Without it, ONE module that cannot be imported aborts collection of the entire
# suite: pytest prints "Interrupted: 1 error during collection" and runs zero
# tests. That is not hypothetical here. tests/test_token_role_id.py imports the
# shared `kernel` package, which core's image deliberately does not carry, and
# the result was that the whole security suite — tenant isolation, dual-auth,
# entitlements, the endpoint tests — silently did not run behind one missing
# module, reported as a single line that looks like one broken file.
#
# The import itself is fixed (run-tests.sh supplies the kernel from the working
# tree; tests/conftest.py finds it). This flag is what stops the NEXT such
# import from taking 49 innocent tests with it: the unimportable module is
# reported as an error, by name, and everything else still runs and still
# reports. The run still exits non-zero, so nothing is swept under the rug.
addopts = "-q --continue-on-collection-errors"
filterwarnings = ["ignore::DeprecationWarning"]
