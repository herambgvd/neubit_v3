[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neubit-reporting"
version = "0.1.0"
description = "Reporting store — schema for the IoT readings pipeline (TimescaleDB hypertable, rollups, retention). Owns neubit_reporting; the reading-writer is its only writer."
requires-python = ">=3.11"

dependencies = [
    "kernel",          # shared kernel (path dep — see [tool.uv.sources])
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

# When installed with uv, resolve kernel from the sibling source dir.
[tool.uv.sources]
kernel = { path = "/opt/kernel", editable = true }

[tool.setuptools.packages.find]
include = ["reporting*"]

[tool.ruff]
line-length = 100
