# electron-builder — packaging for Neubit VMS.
#
# Produces ONE installer that carries both halves:
#
#   * the Electron shell (this directory); and
#   * the SERVER: the native appliance payload (resources\server), staged into
#     ../dist/vms-server by appliance/windows/build-native-appliance.ps1, and
#     registered as the Windows Service "NeubitVMS" by build/installer.nsh.
#     docs/WINDOWS_NATIVE_APPLIANCE.md.
#
# Build order (CI and by hand):
#   appliance\windows\build-native-appliance.ps1   [-Offline for the air-gapped installer]
#   npm run package:win
#
# The Portable exe is the CLIENT-ONLY shape: an operator workstation that
# connects to a server elsewhere. It carries no server.

appId: com.geniusvision.neubit.vms
productName: Neubit VMS
copyright: Copyright © Genius Vision Digital

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - "!**/*.map"
  - "!**/*.ts"

# ── the server payload ───────────────────────────────────────────────────────
#
# Embedded, unlike Route B's 2.9 GB WSL distro (which makensis, a 32-bit program,
# could not map). The native payload is a few hundred MB; the runtimes are
# fetched at install time and SHA-256-verified (or baked in by -Offline).
# The filter keeps a dev leftover (a .env, caches) from shipping by accident.
extraResources:
  - from: ../dist/vms-server
    to: server
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.env"
      - "!**/.env.*"

# ── auto-update ──────────────────────────────────────────────────────────────
#
# DELIBERATELY ABSENT. electron-updater with no publish config reports "no feed"
# and moves on, which is honest; a placeholder URL would make `checkForUpdates`
# fail against a host that does not exist and bury the real error in a stack
# trace. The NVR shell still carries `updates.example.com` for exactly this
# reason and it has never worked.
#
# Filling this in is P4, and it is one decision for BOTH products — see the plan's
# open decisions. When it lands:
#
#   publish:
#     provider: generic
#     url: https://<the feed host>/vms/${channel}
#
# ── code signing ─────────────────────────────────────────────────────────────
#
# ABSENT, AND DEFERRED ON PURPOSE — product owner's call, 2026-08-27. Builds ship
# unsigned for now. Recorded here rather than left looking like an oversight, so
# nobody adds a certificate config believing it was simply forgotten.
#
# Nothing in this file changes when a certificate arrives: electron-builder reads
# it from CSC_LINK / CSC_KEY_PASSWORD in the environment. Only CI changes.
#
# TWO THINGS FOLLOW FROM SHIPPING UNSIGNED, and both are cheaper to know now:
#
#  1. SmartScreen. The installer requests elevation (perMachine), so a customer
#     gets "Windows protected your PC" and has to click More info -> Run anyway.
#     It is not a failure and it looks exactly like one. deploy/windows/README.md
#     carries the click path, so a field engineer is not improvising on site.
#
#  2. AUTO-UPDATE WILL REFUSE TO INSTALL. `nsis.verifyUpdateCodeSignature`
#     defaults to TRUE, and electron-updater verifies the downloaded update's
#     publisher name against its signature before running it. Against an unsigned
#     build that check cannot pass — the update downloads and then does nothing.
#     So when the feed lands (P4) it is signed builds, or
#     `verifyUpdateCodeSignature: false` as a DELIBERATE, argued choice: turning
#     it off means the updater runs whatever the feed serves, which is only
#     acceptable over HTTPS to a host we control.
#
#     Harmless today — there is no publish block above, so nothing ever checks.

win:
  icon: build/icon.ico
  # artifactName is set PER TARGET below, not here.
  #
  # A single `${productName}-${version}-${arch}.${ext}` at this level looks right and
  # silently loses a build: nsis and portable both produce an `.exe`, so they resolve
  # to the same filename and the second one written wins. The first run of this config
  # produced exactly one file in dist/ — the portable, wearing the installer's name.
  target:
    - target: nsis
      arch: [x64]
    # The portable (client-only) build has its own config,
    # electron-builder.portable.yml: it must NOT carry the server payload, which
    # a portable exe would re-extract to %TEMP% on every launch.

nsis:
  artifactName: ${productName} Setup ${version}-${arch}.${ext}
  include: build/installer.nsh
  oneClick: false
  # perMachine, and elevated, because the server half registers a Windows Service,
  # seals its data directory and writes a firewall rule. A per-user install could do none of those and would produce a desktop app
  # beside a server that never starts — the worst of both.
  #
  # A client-only build pays a UAC prompt it does not strictly need. That is the
  # right trade: one prompt, versus two installers to build, sign and tell apart.
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Neubit VMS
  # Keep the operator's saved servers and preferences across an upgrade. They live
  # in userData, which electron-builder does not touch, but deleteAppDataOnUninstall
  # would remove them on the way out — and an uninstall/reinstall to fix something
  # unrelated should not lose the server list.
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName} Portable ${version}-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.business
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

linux:
  icon: build/icon.png
  category: Utility
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
