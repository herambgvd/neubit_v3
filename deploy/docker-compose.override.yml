# ─────────────────────────────────────────────────────────────────────────────
# DEV override — hot-reload for the Python backend services.
#
# `docker compose` auto-merges this file on top of docker-compose.yml for every
# `up` / `build` run from this directory, so it's active in development WITHOUT
# touching the production-clean base compose.
#
# What it does: bind-mounts each service's source over the image copy and runs
# uvicorn with `--reload`, so editing a .py on the host reloads the worker in
# place — no `docker compose build` needed for backend changes anymore.
#
# The images are editable installs (`uv pip install -e .`), so the mounted source
# IS the imported package. vision also gets the shared `kernel` mounted (it's an
# editable `-e /opt/kernel` install) so kernel edits hot-reload too.
#
# WATCHFILES_FORCE_POLLING: Docker Desktop (macOS) does NOT propagate host inotify
# events across the bind-mount VM boundary, so watchfiles must POLL stat() mtimes
# to see host edits. (Same class of issue as the Traefik file-watch on Docker mac.)
#
# NOTE: the uvicorn command is a SINGLE line on purpose — a YAML folded (`>`) block
# with a more-indented continuation preserves the newline, and in `bash -c` that
# newline terminates the uvicorn command early (dropping the --reload flags).
#
# To run WITHOUT hot-reload (prod-like), use the base file only:
#   docker compose -f docker-compose.yml up -d
#
# It also OWNS every published host port except the gateway's :80. The base file
# publishes the gateway alone, because it is what an appliance install runs: with
# postgres/redis/nats published there, an appliance put its datastores on the
# customer's LAN. Everything a developer reaches directly — psql on :5432, the
# Traefik dashboard, core on :8000 — is restored here.
#
# One of those, `frontend` on :3000, is worth knowing about: it serves the console
# but 404s every /api/v1 call, because the console's API base is same-origin
# relative and only the gateway routes /api. Develop against http://localhost, not
# http://localhost:3000, or logging in fails with "Request failed with status
# code 404" and it looks like a broken backend.
# ─────────────────────────────────────────────────────────────────────────────
services:
  gateway:
    ports: ["80:80", "8090:8080"]              # 8090 = Traefik dashboard

  postgres:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  nats:
    ports: ["4222:4222", "8222:8222"]

  core:
    ports: ["8000:8000"]
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/core/app:/app/app
      # Mount migrations too so newly-added Alembic revisions apply on restart
      # (the start command runs `alembic upgrade` before uvicorn).
      - ../backend/core/migrations:/app/migrations
    command: bash -c "alembic upgrade 0001 && alembic stamp head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  vision:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/vision/app:/app/app
      - ../backend/vision/migrations:/app/migrations
      - ../backend/vision/tests:/app/tests
      - ../backend/kernel:/opt/kernel
    command: bash -c "/usr/local/bin/neubit-migrate 0001_vision_baseline && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/kernel/kernel"

  # ── frontends: DEV hot-reload. The base compose builds the PRODUCTION standalone
  # image (node server.js); here we build only the `deps` stage (has node_modules),
  # bind-mount the source over it, and run `npm run dev`. So `docker compose up`
  # (auto-merges this) = dev; `docker compose -f docker-compose.yml up` = production.
  frontend:
    # A DISTINCT TAG, and it matters more than it looks.
    #
    # Without it this `target: deps` build writes to `neubit-v3-frontend:latest` —
    # the very tag the base compose builds the `runner` stage into. Because this
    # override auto-merges on every `up`, running the stack in dev SILENTLY
    # replaced the production image with the deps stage: CMD=[node], no server.js,
    # exits 0 on start, console never comes up. An image payload saved from a
    # developer's machine shipped a console that could not boot, and the base
    # file's "PRODUCTION by default" comment had not been true for months.
    image: neubit-v3-frontend:dev
    ports: ["3000:3000"]                       # serves the UI but 404s /api — see header
    build:
      context: ../frontend
      target: deps
    command: npm run dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next

  admin-frontend:
    image: neubit-v3-admin-frontend:dev        # distinct tag — see the frontend note
    build:
      context: ../admin-frontend
      target: deps
    command: npm run dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../admin-frontend:/app
      - /app/node_modules
      - /app/.next
