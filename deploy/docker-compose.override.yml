# ─────────────────────────────────────────────────────────────────────────────
# DEV override — hot-reload for the Python backend services.
#
# `docker compose` auto-merges this file on top of docker-compose.yml for every
# `up` / `build` run from this directory, so it's active in development WITHOUT
# touching the production-clean base compose.
#
# What it does: bind-mounts each service's source over the image copy and runs
# uvicorn with `--reload`, so editing a .py on the host reloads the worker in
# place — no `docker compose build` needed for backend changes anymore.
#
# The images are editable installs (`uv pip install -e .`), so the mounted source
# IS the imported package. vision also gets the shared `kernel` mounted (it's an
# editable `-e /opt/kernel` install) so kernel edits hot-reload too.
#
# WATCHFILES_FORCE_POLLING: Docker Desktop (macOS) does NOT propagate host inotify
# events across the bind-mount VM boundary, so watchfiles must POLL stat() mtimes
# to see host edits. (Same class of issue as the Traefik file-watch on Docker mac.)
#
# NOTE: the uvicorn command is a SINGLE line on purpose — a YAML folded (`>`) block
# with a more-indented continuation preserves the newline, and in `bash -c` that
# newline terminates the uvicorn command early (dropping the --reload flags).
#
# To run WITHOUT hot-reload (prod-like), use the base file only:
#   docker compose -f docker-compose.yml up -d
# ─────────────────────────────────────────────────────────────────────────────
services:
  core:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/core/app:/app/app
      # Mount migrations too so newly-added Alembic revisions apply on restart
      # (the start command runs `./migrate.sh` before uvicorn).
      - ../backend/core/migrations:/app/migrations
      # The migrate script is part of the schema bring-up and changes with the
      # migrations, so mount it alongside them rather than baking dev to an old copy.
      - ../backend/core/migrate.sh:/app/migrate.sh
    command: bash -c "./migrate.sh && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  vision:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/vision/app:/app/app
      - ../backend/vision/migrations:/app/migrations
      - ../backend/vision/tests:/app/tests
      - ../backend/kernel:/opt/kernel
    command: bash -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/kernel/kernel"

  dashboards:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/dashboards/app:/app/app
      # Mount migrations too so a newly-added revision applies on restart (the
      # start command runs `alembic upgrade head` before uvicorn).
      - ../backend/dashboards/migrations:/app/migrations
      - ../backend/kernel:/opt/kernel
    command: bash -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/kernel/kernel"

  # ── frontends: DEV hot-reload. The base compose builds the PRODUCTION standalone
  # image (node server.js); here we build only the `deps` stage (has node_modules),
  # bind-mount the source over it, and run `npm run dev`. So `docker compose up`
  # (auto-merges this) = dev; `docker compose -f docker-compose.yml up` = production.
  frontend:
    build:
      context: ../frontend
      target: deps
    # NOT a bare `npm run dev`. The entrypoint verifies the container's own
    # node_modules before starting: that it exists, that it was installed from
    # the package-lock.json currently on disk, and that its NATIVE binaries load
    # in this container. It repairs the tree when any of those is false, and it
    # clears a corrupt Turbopack cache if the dev server dies on start.
    #
    # This broke four times in one day and every recovery was manual. The two
    # causes were a volume holding the HOST's macOS binaries in a musl container
    # (a dev server that 500s, or a stylesheet that is 600 bytes of
    # `/* unparsable */` because Tailwind's oxide binary will not load), and a
    # volume seeded once and never refreshed, so a newly added dependency was
    # simply absent no matter how many times the image was rebuilt.
    entrypoint: ["/usr/local/bin/dev-entrypoint.sh"]
    # --webpack, NOT Turbopack, and only here — `npm run dev` stays generic so a
    # native Linux checkout is unaffected.
    #
    # Turbopack's persistent cache does not survive this environment. It failed
    # repeatedly, in three different shapes: a corrupt SST file
    # ("Failed to restore task data"), an endless "Another write batch or
    # compaction is already active", and finally a build that emitted every
    # chunk EXCEPT `chunks/ssr/[turbopack]_runtime.js`, so every route 500'd on
    # `Cannot find module` with a routes-manifest that was never written. That
    # last one reproduced on a brand-new empty volume with 29 GB free, which is
    # what ruled out disk pressure and the macOS bind mount as the cause.
    #
    # webpack dev serves the same app on the first try. The cost is a slower
    # cold start; the benefit is a dev server that comes back up.
    command: ["npm", "run", "dev", "--", "--webpack"]
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      # NAMED, not anonymous. An anonymous volume is invisible in `docker volume
      # ls`, cannot be dropped without knowing its hash, and accumulates a new
      # one per recreate — so "delete the bad node_modules" was itself a puzzle.
      # Naming them makes the repair `docker volume rm neubit-v3_frontend_node_modules`,
      # and the entrypoint above usually means nobody has to.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

  admin-frontend:
    build:
      context: ../admin-frontend
      target: deps
    command: npm run dev
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ../admin-frontend:/app
      # Named for the same reason as the frontend's. This one has no start-up
      # self-check because it has no dev traffic to break; if it starts failing
      # the same way, give it the same `dev-entrypoint.sh`.
      - admin_frontend_node_modules:/app/node_modules
      - admin_frontend_next:/app/.next

  # ── reading-writer: DEV hot-reload. Same pattern as the other Python services.
  # The pipeline lives in the lifespan, so a reload tears the JetStream consumer
  # down and rebuilds it — which is safe (durable consumer, nothing acked that was
  # not written) but does mean an edit costs a few seconds of consumption. The
  # `reporting` package is mounted too: it owns the schema this service imports.
  reading-writer:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/reading-writer/app:/app/app
      - ../backend/reporting:/opt/reporting
      - ../backend/kernel:/opt/kernel
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/reporting/reporting

  # ── reporting-projector: DEV hot-reload. Same pattern as the reading-writer.
  # The consumers live in the lifespan, so a reload tears every durable consumer
  # down and rebuilds it — safe (nothing is acked that was not written) but it
  # costs a few seconds of consumption per edit.
  reporting-projector:
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ../backend/projector/app:/app/app
      - ../backend/reporting:/opt/reporting
      - ../backend/kernel:/opt/kernel
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --reload-dir /opt/reporting/reporting

volumes:
  # The dev containers' own node_modules and build caches. Named so they can be
  # inspected and dropped by name when something does go wrong — see the
  # frontend service's note.
  frontend_node_modules:
  frontend_next:
  admin_frontend_node_modules:
  admin_frontend_next:
