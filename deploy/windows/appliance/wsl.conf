# /etc/wsl.conf inside the neubit-vms distro.
#
# Written into the distro at BUILD time, so a customer machine never has to be
# configured — the tarball arrives already knowing how to start itself.

[boot]
# ── systemd OFF, deliberately ────────────────────────────────────────────────
#
# `docker-ce`'s deb pulls systemd in as a dependency, so it is present whether we
# want it or not. Letting it BOOT is the problem, and the P0 spike found out how:
#
#   * with systemd on, the distro starts `docker.service`, whose ExecStart is
#     `dockerd -H fd:// --containerd=/run/containerd/containerd.sock` — the
#     packaged unit, using the SYSTEM containerd.
#   * boot.sh starts a bare `dockerd`, which brings up its OWN containerd.
#
# Those two see DIFFERENT image stores. After a restart the spike's engine
# reported `images=0` with 8.1 GB sitting in /var/lib/docker, because the images
# had been loaded by one and were being looked for by the other. Nothing is
# corrupt and nothing says so; every image simply vanishes.
#
# One launcher, one store. boot.sh is that launcher, and it is the same script
# build-appliance.ps1 uses to bake the images in — so the store the release
# pipeline writes to is by construction the store the appliance reads from.
systemd=false
command=/opt/neubit/boot.sh

[interop]
enabled=true
# ── the Windows PATH stays out ───────────────────────────────────────────────
#
# Left at its default, `which docker` inside the distro resolves to Docker
# Desktop's Windows CLI at /mnt/c/Program Files/Docker/... on any machine that has
# it installed. Appliance scripts would then drive the WRONG ENGINE, silently, and
# the symptom is an appliance whose containers are "missing" while Docker Desktop
# quietly holds them. Found in the P0 spike on the developer's own box.
appendWindowsPath=false

[automount]
# Needed: the bulk data (recordings, the offline basemap) lives on a Windows
# volume the installer chose, and compose bind-mounts it through /mnt. The
# DATABASE does not — pgdata stays on the distro's own ext4, because Postgres
# fsync over drvfs is punishing. See install-appliance.ps1 for the two paths.
enabled=true
options="metadata,umask=22,fmask=11"

[network]
generateResolvConf=true
