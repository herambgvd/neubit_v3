# Static file server for the offline basemap archive (deploy/tiles/*.pmtiles).
#
# A PMTiles archive is read by the browser with HTTP RANGE requests — MapLibre
# pulls a few KB of directory plus the handful of tiles on screen, never the whole
# multi-GB file. nginx serves ranges out of the box; the settings below just stop
# us from undoing that.

types {
    application/octet-stream pmtiles;
}

server {
    listen 80;
    server_name _;

    # Range requests must not be re-encoded. gzip on a .pmtiles response would
    # force nginx to buffer and drop Accept-Ranges, turning every map pan into a
    # full-archive download.
    gzip off;
    max_ranges 64;

    location /tiles/ {
        # alias, not root: the archive lives in /data (bind-mounted to
        # deploy/tiles/) and the entrypoint writes it there on first start.
        alias /data/;
        autoindex off;

        # Caching the archive saves thousands of range round-trips, but note what
        # is NOT here:
        #
        #   no `always` — with it the header also lands on the 404 below, so a
        #   browser that opens the map while the archive is still being extracted
        #   caches "there is no basemap" and never recovers without a hard reload.
        #   Without it nginx only adds the header to 200/206 (and redirects).
        #
        #   no `immutable`, and a day rather than a week — the archive CAN be
        #   replaced (rebuild at a different TILES_MAXZOOM), and byte ranges from
        #   the old file point at meaningless offsets in the new one.
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;

        # Same-origin through the gateway, so no CORS headers are needed.
        try_files $uri =404;
    }

    location = /tiles-health {
        access_log off;
        return 200 "ok\n";
    }
}
