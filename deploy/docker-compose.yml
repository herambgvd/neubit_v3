# Neubit v3 — local development stack.
# Base tier: gateway (Traefik) · postgres · redis · core (Python/edge) · frontend.
# nvr / realtime / admin-frontend / domain services are added as they are built.

name: neubit-v3

# ── container ceilings: logging + memory ────────────────────────
# Two audits found this deployment unbounded in every direction — not one of the
# containers had a memory limit and not one had a log rotation policy, on a box
# that is ALSO running a video recorder writing to disk, in a customer's
# building, with nobody watching at 3am. A leaking Python service and a json log
# that grows forever are the same outage: the appliance fills its RAM or its
# disk and takes the recorder down with it.
#
# LOGGING. `json-file` with no `max-size` never rotates, ever. The recorder's
# mediamtx alone put 64 MB on disk over 31 days; twenty containers at that rate
# is a disk-full a year after commissioning, on a host nobody logs into. The
# daemon-wide `log-opts` that would fix this globally live in a file we do not
# ship on a customer's machine — this compose does.
#
# 10 MB x 3 files caps each container at 30 MB and the whole estate under a
# gigabyte. 30 MB is still three to four weeks of history at these services'
# volume, which is the window anyone actually reads back.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# MEMORY. `mem_limit` per service, NOT one number for everything: each was sized
# from `docker stats --no-stream` against a running estate, plus headroom for
# the burst that service actually has. The measured idle RSS is quoted in each
# service's comment so the next person can tell a generous limit from one that
# is already tight, instead of guessing the way a copied number forces you to.
# The tiers:
#
#   256m   one job, no buffers — traefik, celery beat, the one-shot db-init
#   512m   a FastAPI satellite: 60-120 MB idle, room for a request burst
#   1g     anything that BUFFERS — a batching writer, a celery prefork pool,
#          segment checksums over the recordings volume, a Node runner
#   2-3g   the datastores and the JVM, sized from what they are CONFIGURED to
#          allocate rather than from what they happen to be using right now
#
# A limit below what a process has already reserved is an OOM kill, not a
# ceiling. That is why postgres's is derived from the shared_buffers set on its
# own command line below, why redis's is twice its maxmemory (it forks to
# snapshot), and why the dev override raises both frontends' — `next dev` is a
# different program from `node server.js` and measures 2.5 GB where the
# production runner measures 115 MB.
#
# These are CEILINGS, not reservations — nothing is set aside and the sum is not
# a requirement. Measured steady state for the whole estate is ~1.5 GB; the
# limits add up to ~15 GB only because every service would have to peak at once,
# and two of them (db-init, reporting-migrate) exit seconds after `up`.
#
# CPU is deliberately NOT capped. A cpu quota on an appliance converts a burst
# into latency rather than preventing anything: the contended resources on this
# box are RAM and the disk the recorder is writing to, and a `cpus:` on core
# would only make a cold-start migration take longer while the recorder keeps
# whatever it was already getting.

networks:
  neubit:
    name: neubit

volumes:
  pgdata:
  # Shared recording store (P3-A): MediaMTX writes fmp4 segments here; the Go nvr
  # scans it (segment tracker) + owns retention. Both containers mount it at
  # /recordings so the on-disk path (cameras/<tenant>/<cam>/<profile>/<seg>.mp4) is
  # identical on both sides.
  recordings:
  # Core's LOCAL object store (settings.storage_local_dir = ./data/storage → /app/data
  # /storage): site images, floorplans, branding logos, exports. Without this volume
  # every upload lives in the container's writable layer, so any rebuild or
  # `up --force-recreate` silently deletes them and `/files/<key>` starts 404ing
  # while the DB still holds the image_url. S3 deployments don't use this path.
  corefiles:
  # JetStream's file store. `-sd /data` had NO volume behind it, so every stream,
  # every message and every durable consumer lived in the nats container's
  # writable layer — a `docker compose up --force-recreate` silently wiped the
  # event spine, and the services quietly re-created empty streams on reconnect.
  natsdata:

services:

  # ── edge gateway ────────────────────────────────────────────────
  gateway:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # Traefik: 57 MB idle and it is a router, not a buffer — it proxies bytes
    # rather than holding them. 256m is ~4x measured and still the smallest
    # ceiling in the file.
    mem_limit: 256m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    image: traefik:v3.1
    command: ["--configFile=/etc/traefik/traefik.yml"]
    # The ONLY published port in this file. Everything else -- the datastores, core,
    # the Next servers, the Traefik dashboard -- is reachable on the compose network
    # and is published for DEVELOPMENT ONLY, from docker-compose.override.yml.
    #
    # An appliance install runs this file alone. Publishing postgres/redis/nats here
    # put the database on the customer's LAN; publishing the frontend on :3000 also
    # handed operators a port that serves the UI but 404s every /api/v1 call, because
    # the console's API base is same-origin relative and only this gateway routes it.
    ports: ["80:80"]
    volumes:
      - ../gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../gateway/dynamic:/etc/traefik/dynamic:ro
      # NO docker socket. The label provider is disabled (gateway/traefik.yml) and
      # routing comes from the file provider, so the mount was unused — and `:ro`
      # only makes the socket FILE read-only, not the daemon API behind it. This is
      # the internet-facing container; it had root-equivalent access to the host
      # for nothing. If the label provider is ever enabled, put a socket proxy in
      # front of it rather than mounting this again.
    networks: [neubit]

  # ── data ────────────────────────────────────────────────────────
  postgres:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # Derived from the command line below, not guessed: shared_buffers 1 GB +
    # up to ~100 live backends at ~10 MB of private memory each + one autovacuum
    # worker at maintenance_work_mem 256 MB is ~2.3 GB worst case. 3g leaves
    # ~25% on top. (Measured 161 MB idle, because shared_buffers is reserved
    # lazily — which is exactly why this limit cannot be sized from `docker
    # stats`.)
    mem_limit: 3g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    image: timescale/timescaledb:2.17.2-pg16
    # EXPLICIT memory and connection settings, because the image's own
    # `timescaledb-tune` sizes them to the WHOLE HOST on first init and then
    # never revisits the decision. On a 12 GB box it picked shared_buffers =
    # 3 GB. That is wrong twice on an appliance: this machine is SHARED with a
    # video recorder that wants the page cache for the segments it is writing,
    # and a shared_buffers larger than `mem_limit` is an OOM kill the moment
    # Postgres touches pages it already reserved. The limit above and these
    # numbers are ONE decision, so they are written next to each other.
    #
    # Command-line `-c` beats postgresql.conf, so this holds on an existing
    # pgdata volume that timescaledb-tune already wrote, not only a fresh one.
    #
    #   max_connections=200   THE FIX. The six services' SQLAlchemy pools sum to
    #       98 — SQLAlchemy's default 5 + 10 per engine on core, ingest, access,
    #       vision, workflow and reading-writer's readings engine, plus the
    #       projector's own VE_PROJECTOR_POOL_SIZE 4 + OVERFLOW 4 — against 97
    #       USABLE, which is the old 100 minus the 3 superuser_reserved. The
    #       ceiling was below the demand, and the failure is `FATAL: sorry, too
    #       many clients already` at whichever service happens to reconnect
    #       last, so it reads as that service being broken. 200 covers the 98,
    #       ops-agent's pg_dump/pg_restore, the migrators, a
    #       `--scale reading-writer=2`, and an engineer's psql DURING the
    #       incident — which is when there are no slots left to get one.
    #   shared_buffers=1GB    the whole estate is ~250 MB of database today and
    #       the only one that grows (neubit_reporting) is bounded by its own
    #       90-day Timescale retention policy. 1 GB caches all of it and leaves
    #       the rest of the box to the recorder.
    #   work_mem=8MB          per sort/hash NODE, so it multiplies by backends
    #       and by plan complexity. 8 MB x 200 backends is the number the
    #       mem_limit above has to survive.
    #   maintenance_work_mem=256MB   autovacuum and index builds, one at a time.
    #       timescaledb-tune had this at 1.5 GB — half the container's ceiling,
    #       held by a background job nobody is waiting on.
    #   effective_cache_size=2GB     a planner HINT, allocates nothing; it just
    #       has to stop claiming 8.9 GB of page cache that the recorder owns.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=2GB
    # NOT `env_file: .env`. That file carries VE_JWT_SECRET, VE_SECRETS_KEY, the
    # DASHFORGE_* secrets, OPS_AGENT_TOKEN and VE_BOOTSTRAP_ADMIN_PASSWORD, and a
    # blanket env_file put every one of them into this container's environment —
    # readable by `docker inspect`, by anything that can exec here, and by the
    # database process itself. The token-signing key for the whole estate has no
    # business inside Postgres. Name what it needs instead.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The per-service databases, on a FRESH volume. Postgres runs initdb
      # scripts on first init only, so this alone left every service added after
      # a deployment's volume was created needing a manual `createdb`. The
      # `db-init` service below runs the SAME script on every `up`, which is what
      # actually keeps an existing volume in step; this hook stays so a fresh
      # volume has its databases before anything else starts.
      - ./postgres/init-service-dbs.sh:/docker-entrypoint-initdb.d/10-init-service-dbs.sh:ro
    healthcheck:
      # NOT `pg_isready -U $$POSTGRES_USER`. That returns 0 as soon as ANY server
      # answers, INCLUDING the temporary one the entrypoint runs while it executes
      # initdb and /docker-entrypoint-initdb.d -- so `depends_on: service_healthy`
      # gated on nothing. On a first boot against an empty volume, core, ingest,
      # vision, access and workflow all raced ahead and exited 1 with
      # ConnectionRefusedError. Invisible on any existing volume; fatal on every
      # fresh install. (It also probed a database named "neubit" -- pg_isready
      # defaults dbname to the user -- and reported healthy straight through the
      # resulting `FATAL: database "neubit" does not exist`.)
      #
      # Two things must be true before a dependant may connect, so check both:
      #   1. the REAL server is listening on TCP. The init server runs with
      #      listen_addresses='' , so -h forces a genuine answer.
      #   2. init-service-dbs.sh has finished. The LAST database it creates is the
      #      completion marker.
      #
      #      This marker was `neubit_nvr` until 2026-09-01, when that database was
      #      deliberately dropped from init-service-dbs.sh (the NVR owns its own
      #      postgres now). The healthcheck was not updated with it, so on a FRESH
      #      volume the marker never appeared, postgres stayed `unhealthy` forever,
      #      and every service gated on `service_healthy` never started — six
      #      containers up and a console that never answered. Invisible on any
      #      EXISTING volume, which is exactly why it reached a customer install.
      #
      #      KEEP THIS IN STEP WITH THE END OF THE LIST IN init-service-dbs.sh.
      #
      #      Checked again on 2026-09-05, when `neubit_dashforge` left that
      #      list with the dashforge satellite. It was NOT the marker --
      #      `dashforge`, DashForge's own database, is last and stayed --
      #      so this line is unchanged. Verified against a FRESH volume in a
      #      throwaway compose project rather than by reading the list,
      #      because reading the list is what failed in 2026-09-01.
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" && psql -U "$$POSTGRES_USER" -d dashforge -c 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [neubit]

  # ── per-service databases, on EVERY start ───────────────────────
  # The initdb hook above only fires on a fresh volume, so it cannot create a
  # database for a service added later — that needed a manual `createdb` on
  # every existing deployment, documented in a comment nobody reads until a
  # service is already restart-looping on "database does not exist". This runs
  # the same idempotent script against the running server on every `up`, so the
  # list in that script is the single source of truth for both cases.
  #
  # It exits 0 when everything exists, and NON-ZERO when a database is missing
  # and could not be created — services depend on `service_completed_successfully`,
  # so a failure stops the stack here rather than surfacing as a restart loop.
  db-init:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # A psql script that creates databases and exits. 256m.
    mem_limit: 256m
    image: timescale/timescaledb:2.17.2-pg16
    # Same reasoning as postgres above: init-service-dbs.sh reads POSTGRES_USER
    # and POSTGRES_DB and nothing else, so it does not need the estate's secrets.
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint: ["bash", "/init-service-dbs.sh"]
    volumes:
      - ./postgres/init-service-dbs.sh:/init-service-dbs.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [neubit]
    restart: "no"

  redis:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # Twice `--maxmemory 256mb` above, because redis FORKS to write an RDB
    # snapshot and the copy-on-write child can approach the parent's size. A
    # limit equal to maxmemory would OOM-kill the save, not bound the dataset.
    # (2.3 MB in steady state on a live estate.)
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    image: redis:7-alpine
    # A BOUND. This is the Celery broker, and workflow-beat publishes two sweeps
    # a minute into it forever; `maxmemory 0` means "take the host's RAM", so a
    # worker that stops draining turns a queue into an unbounded allocation on
    # an appliance whose RAM the video recorder is also using. Nobody is watching
    # at 3am and the first symptom would be the OOM killer picking a victim,
    # which need not be redis.
    #
    # `noeviction` is KEPT, deliberately, and is not the leftover it looks like:
    # an eviction policy on a BROKER silently deletes queued work, which is a
    # worse failure than refusing it. With a ceiling and noeviction the producer
    # gets `OOM command not allowed when used memory > maxmemory` — loud, at the
    # publisher, naming the problem, exactly as asked for.
    #
    # 256mb against 2.3 MB in steady state on a live estate: ~100x headroom, so
    # touching it means something is genuinely wedged rather than merely busy.
    # Celery's own result rows (`celery-task-meta-*`) expire on result_expires
    # and are not what would fill this.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [neubit]

  nats:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # JetStream. The stream itself is a FILE store on the natsdata volume and is
    # bounded at 8 GiB there, but the consumer state, the ack-pending window
    # (VE_READINGS_MAX_ACK_PENDING is 5000) and in-flight messages are memory.
    # 37 MB idle; 1g is the burst ceiling for a backlog being drained.
    mem_limit: 1g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    image: nats:2.10-alpine
    # -m 8222 enables the HTTP monitoring endpoint. Without it, port 8222 was
    # published but nothing listened on it, so stream/consumer state could not be
    # inspected over HTTP at all — every "is the bus backed up?" question needed a
    # throwaway nats-box container on the docker network. Monitoring is read-only
    # (no publish, no admin), so exposing it costs nothing and answers:
    #   curl -s localhost:8222/jsz?streams=1 | jq
    #   curl -s localhost:8222/varz | jq .
    # `-c` replaces the flags: the config file carries jetstream, the monitoring
    # port and — the point of it — the per-service users. Without a config there
    # was no authentication at all, so anything that could reach 4222 could publish
    # any subject on any tenant and delete any durable consumer.
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      # NATS expands $VAR when it parses the config, so the file names no secret.
      NATS_PASS_CORE: ${NATS_PASS_CORE:?set NATS_PASS_CORE in deploy/.env}
      NATS_PASS_ACCESS: ${NATS_PASS_ACCESS:?set NATS_PASS_ACCESS in deploy/.env}
      NATS_PASS_INGEST: ${NATS_PASS_INGEST:?set NATS_PASS_INGEST in deploy/.env}
      NATS_PASS_VISION: ${NATS_PASS_VISION:?set NATS_PASS_VISION in deploy/.env}
      NATS_PASS_WORKFLOW: ${NATS_PASS_WORKFLOW:?set NATS_PASS_WORKFLOW in deploy/.env}
      NATS_PASS_READING_WRITER: ${NATS_PASS_READING_WRITER:?set NATS_PASS_READING_WRITER in deploy/.env}
      NATS_PASS_CONFLUX: ${NATS_PASS_CONFLUX:?set NATS_PASS_CONFLUX in deploy/.env}
    # 4222 + 8222 published for DEVELOPMENT ONLY, from docker-compose.override.yml.
    # An appliance install runs THIS file alone, and publishing the event bus put
    # it on the customer's LAN.
    volumes:
      - natsdata:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [neubit]

  # ── infra-control sidecar (privileged) ──────────────────────────
  # The ONLY service that mounts the docker socket. NO host port, NO traefik
  # labels — reachable only on the internal `neubit` network, and only from
  # `core`, which authenticates every call with X-Ops-Token. Never mount the
  # docker socket into core.
  ops-agent:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 61 MB idle, but it STREAMS pg_dump and pg_restore through itself. Streamed,
    # so the dump size is not the memory size — 512m covers the buffers and the
    # subprocess, and it is the one container holding the docker socket, so a
    # ceiling on it is worth more than the 200 MB it saves.
    mem_limit: 512m
    build: ../backend/ops-agent
    # NO env_file. This container holds the docker socket; `.env` would hand it
    # VE_JWT_SECRET, VE_SECRETS_KEY and every other platform credential it has no
    # use for. It reads exactly these eight variables — grep os.getenv in main.py.
    environment:
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN}
      COMPOSE_PROJECT: neubit-v3
      DB_SERVICE: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:-neubit_control}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VE_LOG_LEVEL: ${VE_LOG_LEVEL:-INFO}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket's GROUP, which is what mode 0660 actually gates on — the image runs
    # as uid 10001 like everything else rather than as root. 0 is correct for Docker
    # Desktop, where the socket is root:root inside the container. On a Linux host it
    # is usually root:docker: check with
    #   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock alpine stat -c %g /var/run/docker.sock
    # and set that gid here. Getting it wrong is loud, not silent: /readyz pings the
    # daemon, so the container reports unhealthy instead of quietly 502ing.
    group_add:
      - "0"
    # /readyz pings the daemon. /health only says the process is up, and the
    # agent's entire purpose is the socket — without this the container reported
    # running while every request 502'd. No curl in the image, so python does it.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9000/readyz',timeout=4).status==200 else 1)\" || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 20s
    networks: [neubit]
    restart: unless-stopped

  # ── platform core (Python / edge) ───────────────────────────────
  core:
    # INFRASTRUCTURE ALARMS run in this container (app/watchdog.py): disk usage
    # from the ops-agent, container health from the ops-agent, EVENTS_DLQ depth
    # from reading-writer, delivered to super-admins through the notification
    # channels. Every knob has a working default and none is listed here, because
    # a variable in this file that only restates a default is a setting somebody
    # later has to check is real. To tune one, ADD it here:
    #   VE_WATCHDOG_ENABLED       "0" turns it off entirely
    #   VE_WATCHDOG_INTERVAL_SEC  poll interval (default 300)
    #   VE_WATCHDOG_REARM_SEC     re-send a standing alarm after this (default 86400)
    #   VE_WATCHDOG_DISK_PCT      disk-used alarm threshold (default 85)
    #   VE_WATCHDOG_DLQ_DEPTH     EVENTS_DLQ depth threshold (default 1)
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 117 MB idle, the highest ceiling of any of the Python APIs because core is
    # the one that holds things: report exports are built in-process, the local
    # object store's uploads pass through it, dashforge was folded in, and every
    # open SSE relay is a live connection with a buffer behind it.
    mem_limit: 1g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build: ../backend/core
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://core:${NATS_PASS_CORE}@nats:4222
      # Reach the privileged infra sidecar over the internal network (see ops-agent).
      OPS_AGENT_URL: ${OPS_AGENT_URL}
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN}
      # The compose `neubit` bridge, which is where Traefik sits. Core only believes
      # `X-Forwarded-For` from an address in here.
      #
      # It lives in this file and NOT in `.env`, deliberately: `.env` is gitignored,
      # so a value set there is absent from every fresh checkout — and the failure is
      # silent. Without it core attributes every external request to the GATEWAY's
      # address, so the per-IP login cap applies to the whole deployment at once and
      # ten requests a minute deny login to every user in the estate.
      #
      # Do NOT widen this to 0.0.0.0/0. Trusting the header from anyone lets a caller
      # send a different value per request and get a fresh rate-limit bucket each
      # time, which removes the cap instead of sharing it.
      # See backend/core/app/core/client_ip.py.
      VE_TRUSTED_PROXY_CIDRS: '["172.19.0.0/16"]'
      # Core builds its own engine rather than the kernel's, so this setting had
      # to be added there before a line here could do anything (it was, and
      # defaults to 0 = no ceiling, which is the kernel's meaning). 30s matches
      # the other request-path services; the SSE relays are unaffected, because
      # the long thing there is the stream and not any query — authorisation does
      # two primary-key reads and closes its session, and the relay loop touches
      # no database at all.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_CORE:-30000}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
    # 8000 published for DEVELOPMENT ONLY, from docker-compose.override.yml.
    #
    # `migrate.sh`, NOT `alembic upgrade head` and NOT the old
    # `upgrade 0001 && stamp head`. The 0001 baseline is a create_all() of the
    # live ORM metadata, so on a FRESH database the later deltas collide, while on
    # an EXISTING one a blanket `stamp head` marks every unapplied migration as
    # done and it silently never runs. The script picks the right branch per
    # database — see the long comment at the top of backend/core/migrate.sh.
    #
    # `--timeout-graceful-shutdown`: uvicorn's default is None, which
    # `asyncio.wait_for` reads as "wait forever" — so ONE open SSE relay on
    # `/api/v1/realtime/…` (a browser with a dashboard open is enough) makes
    # `docker compose restart core` sit on "Waiting for connections to close"
    # indefinitely. The relays now end their own responses on SIGTERM
    # (backend/core/app/core/shutdown.py) and this is the BACKSTOP for everything
    # that cannot: a WebSocket parked on receive_text(), a request wedged on a
    # slow query, a relay added later that forgets to check.
    command: >
      bash -c "./migrate.sh &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000
               --timeout-graceful-shutdown 10"
    volumes:
      # Persist uploaded blobs across rebuilds — see the `corefiles` volume note.
      - corefiles:/app/data
    # `/readyz`, NOT `/health`. `/health` is `return {"status": "ok"}` with no
    # dependency injected at all — it answers 200 with Postgres stopped, while every
    # /api/v1 route 500s on get_db. `/readyz` asks the database, redis and the storage
    # backend and answers 503 naming the one that failed. It was written, correct,
    # and consumed by NOTHING: this service had no healthcheck stanza and Traefik did
    # not route the path, so every prober reported green through a total outage.
    #
    # start_period covers `migrate.sh` on a cold database, the same reason the
    # workflow API's does.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s
    networks: [neubit]
    labels:
      - traefik.enable=true
      # `/readyz` is routed so an external load balancer or orchestrator can probe the
      # endpoint the docs point at.
      #
      # `/metrics` is NOT, and that is the change: it was public, unauthenticated,
      # and in the rate-limit skip list, publishing every route template in the
      # platform to the internet — while nothing scrapes it, because this stack has
      # no Prometheus. It stays served on the container port, reachable from inside
      # the network and from the dev-published 8000, exactly like the ops-agent's own
      # probes further down this file.
      - traefik.http.routers.core.rule=PathPrefix(`/api`) || PathPrefix(`/health`) || PathPrefix(`/readyz`) || PathPrefix(`/files`)
      - traefik.http.routers.core.entrypoints=web
      - traefik.http.services.core.loadbalancer.server.port=8000

  # ── core-worker / core-beat: still not services, and now they never will be ──
  # Core's three housekeeping sweeps — expired reset tokens, old report exports,
  # audit rows — run inside the core API process, started from its lifespan and
  # cancelled on shutdown, the same shape ingest and vision use.
  #
  # They used to be Celery tasks that had never once executed: the app named an
  # `edge` package that does not exist, the beat schedule asked for task names
  # that register under a different module, and both Celery apps shared one Redis
  # DB and the default queue — so core's first enqueued task would have been
  # delivered to workflow-worker, the container driving every incident escalation
  # in the estate. Adding the two containers would have turned a dormant bug into
  # a live one. That path is deleted now, not merely unused.
  #
  # Their windows are `VE_CORE_RETENTION_SWEEP_SEC` and `VE_REPORT_RETENTION_DAYS`
  # in core's environment above. The audit window stays operator-set and defaults
  # to keep-forever on purpose — see the comment there.

  # ── ingest service (Python / neubit_common) ─────────────────────
  # External webhooks / event ingestion. Owns its own DB (neubit_ingest).
  # Authorizes core-minted JWTs locally; cross-domain via NATS.
  ingest:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 73 MB idle. A webhook receiver: bounded request bodies in, rows out, no
    # accumulation. 512m is ~7x measured.
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: ingest/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://ingest:${NATS_PASS_INGEST}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_ingest
      # A ceiling on every query this service runs, SET server-side on each
      # pooled connection by kernel.db. Without it (the default is 0, unlimited)
      # a query blocked on a lock holds its pooled connection forever: the pool
      # drains, /readyz stays green because the process is fine, and the service
      # stops answering with nothing in the logs to say why. The timeout turns
      # that silence into an exception the request path already handles.
      #
      # 15s for ingest. This is a webhook RECEIVER: bounded body in, one row
      # out, no scan and no report. Anything here that has not finished in 15
      # seconds has already lost its delivery — the device on the other end
      # timed out and will retry — so a low ceiling frees the connection for the
      # next delivery instead of holding it for a caller that has gone.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_INGEST:-15000}
      # The origin integrators point their devices at, used to build the webhook's
      # copy-pasteable receiver URL. This is the GATEWAY (Traefik routes
      # /ingest/hooks here), never the frontend dev server on :3000 — that origin
      # would serve the operator UI instead of the receiver. Override per
      # deployment with the real public hostname.
      VE_INGEST_PUBLIC_BASE_URL: ${VE_INGEST_PUBLIC_BASE_URL:-http://localhost}
      # Whose X-Forwarded-For the receiver may believe. Same value and meaning as
      # core's: the compose network, which is where Traefik sits. Empty (the
      # default) means trust nothing and record the socket peer — safe, but every
      # delivery would be attributed to the gateway. NOT in .env, which is
      # gitignored and therefore absent from a fresh checkout.
      VE_TRUSTED_PROXY_CIDRS: '["172.19.0.0/16"]'
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_started }
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # /readyz, not /health. /health is a static dict; /readyz asks the database and
    # the event bus. An accepted webhook that never reaches the bus is an event
    # the platform silently lost, so a dead bus is a readiness failure here.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks: [neubit]

  # ── dashforge: NOT A SERVICE ANY MORE ───────────────────────────
  # A `dashforge` container stood here from 2026-09-03 to 2026-09-05, owning
  # neubit_dashforge and serving /api/v1/dashforge. It was folded into core as
  # `backend/core/app/dashforge` — 1,256 lines with no public surface, no
  # independent load and no failure domain worth isolating, built as a satellite
  # only because that is this fleet's pattern. The routes, the permissions and
  # the 15-minute per-session token mint are unchanged; they answer from core,
  # which already owns /api/ at the gateway.
  #
  # VE_DASHFORGE_* still exists and is still read — by CORE now, via its
  # `env_file: .env`, the same way it reads every other VE_ setting. See
  # .env.example and backend/core/app/dashforge/config.py, which explains what
  # the service account is a ceiling on.
  #
  # NOT removed with it: `dashforge` (no neubit_ prefix), DASHFORGE'S OWN
  # database in init-service-dbs.sh, and docker-compose.dashforge.yml, which
  # composes in the DashForge PRODUCT. Different thing, confusingly similar name.
  # The postgres healthcheck probes that database as its completion marker and is
  # deliberately untouched here.

  # ── workflow service (Python / neubit_common) ───────────────────
  # SOP / automation engine. Owns its own DB (neubit_workflow). API + a Celery
  # worker + beat (three containers sharing one image).
  workflow:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 100 MB idle — the API half, plus the inline NATS correlation consumer
    # (VE_WORKFLOW_INLINE_CORRELATION). 512m.
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: workflow/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://workflow:${NATS_PASS_WORKFLOW}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_workflow
      # 15s — same reasoning as ingest's (read the long note there). This is the
      # API half: an operator waiting on a console panel has given up long before
      # 15 seconds, so holding the connection past that helps nobody. The WORKER
      # and BEAT containers below get a different number, and that is the point
      # of setting these per service rather than once in .env.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_WORKFLOW:-15000}
      # Host the NATS→incident correlation consumer in this API process (v1 simple).
      VE_WORKFLOW_INLINE_CORRELATION: "1"
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      nats: { condition: service_started }
    command: >
      bash -c "alembic upgrade head &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    # Gated on /readyz, NOT /health. /health is liveness and answers 200 while the
    # process is alive with Postgres, Redis and NATS all down -- which is exactly
    # what it is for, and exactly why it is useless as a compose gate. /readyz
    # actually asks the database, the Celery broker and each NATS durable, and
    # answers 503 naming the one that failed. Before this, `docker compose ps`
    # said `Up` for all three of these containers no matter what, so nothing could
    # gate on service_healthy and a wedged service looked like a working one.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      # The API runs `alembic upgrade head` before uvicorn binds, so the grace
      # period has to cover a migration on a cold database, not just a boot.
      start_period: 90s
    networks: [neubit]

  workflow-worker:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 310 MB idle, the largest of the Python processes by a wide margin, because
    # a celery prefork pool is N child processes each holding its own interpreter
    # and its own connection pool. It is also the one that runs the sweeps, so
    # its peak is furthest from its idle. 1g.
    mem_limit: 1g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: workflow/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://workflow:${NATS_PASS_WORKFLOW}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_workflow
      # 30s, twice the API's, because THIS process runs the sweeps — escalation,
      # timeout, notification drain — and each walks a set of instances rather
      # than fetching one row. 30s is not a round number: beat publishes two
      # sweeps a minute, so a sweep still running at 30 seconds is about to be
      # lapped by the next one, and cutting it there is what stops a slow sweep
      # stacking copies of itself on the pool. The failure surfaces as a task
      # error the retry path already handles — strictly better than a worker
      # wedged on a lock while `celery inspect ping` keeps answering pong.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_WORKFLOW_WORKER:-30000}
    depends_on:
      redis: { condition: service_healthy }
      # service_HEALTHY, not service_started. The API container is the one that
      # runs `alembic upgrade head`; "started" only means uvicorn's process
      # exists, so the worker could begin sweeping against a schema that was
      # still being migrated. There is now a probe that can express the
      # difference, so express it.
      workflow: { condition: service_healthy }
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
    # The worker has no HTTP framework and should not grow one, but it has the
    # failure mode that most needs a probe: task consumer cancelled or pool
    # deadlocked, process perfectly alive, nothing executed. `celery inspect ping`
    # cannot see that -- it is answered by the control consumer on a broadcast
    # queue, a different consumer on a different queue from the one carrying work,
    # so it says pong straight through the wedge (verified). So app/worker.py runs
    # a stdlib probe server on :8000 whose /readyz reds when no task has COMPLETED
    # within VE_WORKFLOW_WORKER_SILENCE_SEC. That is not a traffic gauge: the beat
    # schedule publishes two sweeps a minute forever, so an estate with zero
    # incidents still keeps this green.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [neubit]

  workflow-beat:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 60 MB idle. Beat publishes two sweeps a minute and holds nothing. 256m.
    mem_limit: 256m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: workflow/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://workflow:${NATS_PASS_WORKFLOW}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_workflow
      # 30s, matching the worker. Beat barely touches the database, but it shares
      # this image and this DSN, and a scheduler blocked on a query stops
      # publishing — which the worker's own /readyz then reports as a SILENT
      # WORKER, pointing whoever is paged at the wrong container.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_WORKFLOW_BEAT:-30000}
    depends_on:
      redis: { condition: service_healthy }
      workflow: { condition: service_healthy }
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    # Same server, the other half of the pair: beat's /readyz reds when nothing has
    # been PUBLISHED within VE_WORKFLOW_BEAT_SILENCE_SEC. Two separate probes
    # rather than one because a silent worker and a silent beat need different
    # people looking at different logs, and the worker's reason string quotes
    # beat's age precisely so it can point at this container instead of itself.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [neubit]

  # ── access-control (gates) service (Python / neubit kernel) ─────
  # Registers access controllers (DDS via OData + SignalR), mirrors their
  # entities, and ingests real-time access events onto the NATS spine
  # (tenant.<id>.access.<category>.<type>) for workflow correlation. Owns its own
  # DB (neubit_access). Authorizes core-minted JWTs locally; cross-domain via NATS.
  access:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 73 MB idle, with one burst worth naming: the nightly reconcile
    # (VE_ACCESS_RECONCILE_SCHEDULER) pulls a controller's whole entity set and
    # bulk-upserts it. That is a list in memory, so 512m rather than 256m.
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: access/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://access:${NATS_PASS_ACCESS}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_access
      # 30s, not ingest's 15s, and the reconcile below is why: it pulls a
      # controller's whole entity set over OData and bulk-upserts it under a
      # Postgres advisory lock. That is a legitimately long statement on an
      # estate with real hardware, and cutting it at 15s would abort a nightly
      # sync that was working. 30s still bounds it — a mirror that cannot write
      # in half a minute is blocked, not busy.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_ACCESS:-30000}
      # The periodic reconcile. `reconciler_cron` (default 0 3 * * *) has been on
      # every controller row since the port and nothing fired it, so a nightly
      # sync only ever happened when somebody pressed the button.
      #
      # ON here, off in the code: a background writer that talks to a customer's
      # access hardware should be a deployment's choice, not something an upgrade
      # turns on. Set to 0 to stop it. The claim is a Postgres advisory lock per
      # instance, so `--scale access=2` does not double-pull a controller.
      VE_ACCESS_RECONCILE_SCHEDULER: ${VE_ACCESS_RECONCILE_SCHEDULER:-1}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_started }
    # 0001_access_baseline is a metadata baseline — see deploy/migrate.sh.
    command: >
      bash -c "/usr/local/bin/neubit-migrate 0001_access_baseline &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./migrate.sh:/usr/local/bin/neubit-migrate:ro
    # /readyz, not /health. /health is a static dict that answers 200 with Postgres
    # stopped; /readyz asks the database and the event bus. The service had no
    # healthcheck at all, so nothing consumed either. Not routed by the gateway —
    # a satellite's probes are an internal concern (see gateway/dynamic/routes.yml).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks: [neubit]

  # ── vision — VMS control-plane (Python / neubit kernel) ─────────
  # Camera + NVR master records, ONVIF onboarding/discovery, multi-brand drivers,
  # config, per-camera ACL, health aggregation. Owns its own DB (neubit_vision).
  # Reuses core RBAC (verifies core-minted JWTs locally); interoperates with the Go
  # `nvr` data-plane over NATS + REST. Emits tenant.<id>.vms.* + device.camera.*.
  vision:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 92 MB idle, but this is the one that touches VIDEO: it reads and checksums
    # fmp4 segments off the /recordings volume, and it holds the camera, NVR and
    # ONVIF state for the estate. A checksum is streamed, not slurped, so the
    # segment size is not the memory size — 1g is for the ONVIF discovery and
    # health-aggregation bursts across many cameras at once.
    mem_limit: 1g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: vision/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://vision:${NATS_PASS_VISION}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_vision
      # 30s. Vision's reads are not point lookups: health aggregation spans every
      # camera in the estate and the recording/evidence listings are range scans
      # over a growing table, so an API-tier 15s would cut work that is genuinely
      # finishing. It is also the service holding every EVIDENCE LOCK, and a
      # lock held by a hung transaction is the one failure here that outlives the
      # request — 30s puts a ceiling on how long that can last.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS_VISION:-30000}
      # P2-B live streaming: where vision reaches the Go nvr data-plane (internal
      # docker DNS) + the media-token TTL (browser HLS/WHEP token; renewable).
      VE_NVR_URL: ${VE_NVR_URL:-http://nvr:8000}
      # What this VMS calls itself on a recorder it federates. The label is
      # written into the RECORDER's own credential list, so an operator standing
      # at that recorder can tell which VMS holds a key — set it per deployment
      # when an estate runs more than one.
      VE_FEDERATION_LABEL: ${VE_FEDERATION_LABEL:-Neubit VMS}
      VE_MEDIA_TOKEN_TTL_SEC: ${VE_MEDIA_TOKEN_TTL_SEC:-300}
      # ── WHERE THE SEGMENTS ARE. Paths only. ────────────────────────────────
      # VE_RECORDINGS_DIR is the shared volume MediaMTX writes and the Go nvr
      # scans, mounted at the same path on both sides so the on-disk
      # cameras/<tenant>/<cam>/<profile>/<seg>.mp4 layout matches. Vision READS
      # it (checksums, clip assembly); it does not sweep it.
      # VE_DOWNLOADS_DIR is where an assembled clip is written, a subdirectory
      # of the same volume by default. Both are read by
      # backend/vision/app/vms/storage/service.py and .../vms/common/downloads.py.
      VE_RECORDINGS_DIR: ${VE_RECORDINGS_DIR:-/recordings}
      VE_DOWNLOADS_DIR: ${VE_DOWNLOADS_DIR:-/recordings/downloads}
      #
      # RETENTION IS NOT SET HERE, AND NOTHING IN THIS FILE PRUNES FOOTAGE.
      #
      # Four settings stood in this block until 2026-09-14 —
      # VE_RETENTION_TICK_SEC, VE_DEFAULT_RETENTION_DAYS, VE_EXPORT_TICK_SEC and
      # VE_EXPORT_CONCURRENCY — shipped, documented and injected into this
      # container, and read by NOTHING. Their workers went with the storage
      # data-plane when the NVR took ownership of recording storage (the same
      # change that removed the minio cold tier a few lines below); the
      # environment lines did not, and the comment above them went on describing
      # a "retention/tiering sweep" and an "export worker" that no longer exist.
      # Verified before deleting: `grep -rn` for each name across backend/,
      # frontend/ and deploy/ found only this file and one line of
      # backend/vision/README.md.
      #
      # The cost of leaving them was not clutter. An engineer sizing a
      # customer's disk read `VE_DEFAULT_RETENTION_DAYS: 30`, believed the VMS
      # prunes footage at 30 days, and sized for 30 days of video. It does not.
      # The REAL control is the RECORDER's per-camera `retention_days`, held and
      # enforced in the NVR's own repository and database — a different codebase
      # on a different release train. Set it there, per camera. Nothing you can
      # write in this file will delete a segment.
      #
      # (The other retention knobs in this stack are unrelated and do work:
      # VE_READINGS_* under `reporting-migrate` are Timescale policies on the
      # IoT readings hypertable, and VE_INGEST_LOG_RETENTION_DAYS drives
      # ingest's in-process delivery-log sweep. Neither touches video.)
      # G8 stream codec policy (zero-transcode live view): when on (default), onboarding a
      # camera whose SUB (web) stream is H.265 best-effort pushes it to H.264 at the device
      # so browsers play live with no transcode (main stays H.265 for recording). The
      # H.265→H.264 transcode fallback stays as a safety net for non-reconfigurable devices.
      VE_ENFORCE_H264_WEB: ${VE_ENFORCE_H264_WEB:-true}
    # Vision had NO healthcheck: `docker compose ps` never said healthy or
    # unhealthy for the service holding every camera, recording and evidence
    # lock, because there was nothing to ask. It consumes /readyz — added with
    # app/probes.py — so an unreachable database takes it out of the load
    # balancer instead of quietly answering 200 from /health.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_started }
    volumes:
      # P3-B: mount the shared recordings volume so vision can CHECKSUM segments
      # (read) and the retention/tiering worker can DELETE + COPY them (write) — same
      # /recordings path as mediamtx + nvr so the on-disk paths match.
      - recordings:/recordings
      - ./migrate.sh:/usr/local/bin/neubit-migrate:ro
    # 0001_vision_baseline is a metadata baseline. This service is the one the P0
    # spike caught failing on a fresh database — 0025 tried to ADD a column the
    # baseline had already created. See deploy/migrate.sh.
    command: >
      bash -c "/usr/local/bin/neubit-migrate 0001_vision_baseline &&
               uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks: [neubit]

  # minio (dev S3 cold tier) REMOVED — recording storage / tiering is owned by the
  # NVR recorder, not this VMS. The vision storage data-plane was removed, so no S3
  # cold tier is needed here.

  # ── reporting store (schema owner, one-shot migrator) ───────────
  # The IoT readings pipeline's database: neubit_reporting on the shared postgres
  # (TimescaleDB 2.17 — the platform's first hypertable). Owns the `readings`
  # hypertable, the `points` dimension, and the 1m/1h continuous aggregates.
  #
  # This container is NOT a server. It ensures the database exists, runs the
  # migrations, reconciles the Timescale background policies against the
  # VE_READINGS_* environment below, and exits. `restart: "no"` on purpose — a
  # migrator that restarts forever is a migrator that is failing in a loop.
  # The reading-writer (the NATS JetStream consumer that fills the schema) is a
  # separate, long-running service.
  #
  # The reporting DB is the ONE place data from several services is gathered for
  # querying — the documented exception to the platform's no-cross-service-reads
  # rule. It reads no other service's private schema; data arrives over NATS.
  reporting-migrate:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # A one-shot migrator: alembic plus the Timescale policy reconcile, then it
    # exits. 512m covers an index build's client side.
    mem_limit: 512m
    build:
      context: ../backend
      dockerfile: reporting/Dockerfile
    env_file: .env
    environment:
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_reporting
      # ── Retention / compression knobs. Change these per deployment; different
      # compliance regimes want very different windows. Raw short, rollups long.
      # After editing: `docker compose up -d reporting-migrate` re-reconciles.
      # Set any retention var to `off` to disable that policy entirely.
      # Full documentation: backend/reporting/reporting/policies.py
      VE_READINGS_CHUNK_INTERVAL: ${VE_READINGS_CHUNK_INTERVAL:-1 day}
      VE_READINGS_COMPRESS_AFTER: ${VE_READINGS_COMPRESS_AFTER:-7 days}
      VE_READINGS_1M_COMPRESS_AFTER: ${VE_READINGS_1M_COMPRESS_AFTER:-30 days}
      VE_READINGS_1H_COMPRESS_AFTER: ${VE_READINGS_1H_COMPRESS_AFTER:-365 days}
      VE_READINGS_RETENTION: ${VE_READINGS_RETENTION:-90 days}
      VE_READINGS_1M_RETENTION: ${VE_READINGS_1M_RETENTION:-400 days}
      VE_READINGS_1H_RETENTION: ${VE_READINGS_1H_RETENTION:-1825 days}
      VE_READINGS_1M_REFRESH_START: ${VE_READINGS_1M_REFRESH_START:-2 hours}
      VE_READINGS_1M_REFRESH_END: ${VE_READINGS_1M_REFRESH_END:-1 minute}
      VE_READINGS_1M_REFRESH_EVERY: ${VE_READINGS_1M_REFRESH_EVERY:-1 minute}
      VE_READINGS_1H_REFRESH_START: ${VE_READINGS_1H_REFRESH_START:-1 day}
      VE_READINGS_1H_REFRESH_END: ${VE_READINGS_1H_REFRESH_END:-1 hour}
      VE_READINGS_1H_REFRESH_EVERY: ${VE_READINGS_1H_REFRESH_EVERY:-5 minutes}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
    restart: "no"
    networks: [neubit]

  # ── reading-writer (IoT pipeline, Phase B) ──────────────────────
  # The ONLY thing that writes the `readings` hypertable. A durable QUEUE-GROUP
  # JetStream consumer on `IOT_READINGS` (subjects `tenant.*.iot.>`), filtered to
  # `tenant.*.iot.reading.>` — alerts are events, not measurements, and have no
  # row here.
  #
  # ALSO, since 2026-09-05, the ONLY thing that writes the relations declared in
  # `neubit_reporting.reporting_projections` — one durable pull consumer per row,
  # which was the `reporting-projector` container until this file stopped
  # describing one. The two owners did not merge; the two PROCESSES did. Nothing
  # in `app/projections` writes the readings schema and nothing in `app/` writes a
  # projected relation, and the four things that stop a projection backlog
  # stalling reading ingestion are listed in backend/reading-writer/app/main.py
  # — separate NATS connections, separate durables, separate tasks, and a
  # separate connection pool, which is the one that used to be free.
  #
  # REDUNDANCY: scale it. `docker compose up -d --scale reading-writer=2` and NATS
  # distributes messages between the replicas, because every replica binds the
  # SAME durable name — readings and each projection alike. No leader election,
  # nothing to configure per replica. (Drop the host port binding below if you
  # scale beyond one.)
  #
  # It imports the schema from the `reporting` package and never redeclares it; it
  # does not run migrations — `reporting-migrate` owns that. It DOES create the
  # relations a projection declares, because those are declared as data and no
  # migration can know them (see app/projections/ensure.py).
  reading-writer:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # 75 MB idle, and 1g rather than 512m because everything about this service is
    # a BUFFER: 500-row batches x a queue of 4 on the readings half, 200 x 4 on
    # the projections half, both with their own connection pool, plus up to
    # VE_READINGS_MAX_ACK_PENDING (5000) messages in flight from NATS. Its idle
    # figure is the least representative number in this file.
    mem_limit: 1g
    build:
      context: ../backend
      dockerfile: reading-writer/Dockerfile
    env_file: .env
    environment:
      # Its OWN broker credential. `.env`'s VE_NATS_URL is anonymous and the
      # broker no longer accepts that; the user here is what deploy/nats/nats.conf
      # scopes this service's publish permissions to.
      VE_NATS_URL: nats://reading-writer:${NATS_PASS_READING_WRITER}@nats:4222
      VE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/neubit_reporting
      # ── the stream this service OWNS (created/converged at startup) ─────────
      # Bounded on BOTH size and age; whichever binds first wins. See
      # backend/reading-writer/app/config.py for how these numbers were chosen.
      VE_IOT_STREAM_MAX_BYTES: ${VE_IOT_STREAM_MAX_BYTES:-8589934592}
      VE_IOT_STREAM_MAX_AGE_SEC: ${VE_IOT_STREAM_MAX_AGE_SEC:-604800}
      # ── batching: flush on N rows or T ms, whichever comes first ────────────
      VE_READINGS_BATCH_ROWS: ${VE_READINGS_BATCH_ROWS:-500}
      VE_READINGS_BATCH_MS: ${VE_READINGS_BATCH_MS:-1000}
      VE_READINGS_QUEUE_BATCHES: ${VE_READINGS_QUEUE_BATCHES:-4}
      # ── ack: only after the batch is durably written ────────────────────────
      VE_READINGS_ACK_WAIT_SEC: ${VE_READINGS_ACK_WAIT_SEC:-120}
      VE_READINGS_MAX_ACK_PENDING: ${VE_READINGS_MAX_ACK_PENDING:-5000}
      # ── tenant resolution: the gateway's tenant key → a platform tenant UUID.
      # The live aeon feed publishes the literal key `default`, which is not a
      # UUID, and `readings.tenant_id` is `uuid NOT NULL`. Map it, or unmapped
      # keys get a stable synthetic UUID and a loud warning. See app/tenants.py.
      # ── IoT fleet channel (Phase 2) ─────────────────────────────────────
      # The conflux FLEET SERVER this platform reads gateways from. conflux is
      # a protocol parser and a deployment runs several, with one acting as the
      # fleet server the rest enrol into; this is that one.
      #
      # Unset disables the whole surface — the sync never starts and
      # /api/v1/iot answers that no gateway server is configured. That is the
      # right default for a deployment with no conflux.
      #
      # host.docker.internal because conflux runs in its OWN compose project on
      # its own network and publishes 8600 on the host; it reaches this
      # platform's NATS the same way, in the other direction.
      VE_IOT_FLEET_URL: ${VE_IOT_FLEET_URL:-}
      # conflux's EDGE_TOKEN — a machine bearer. An operator JWT expires and
      # nothing would renew it on a server-to-server call.
      VE_IOT_FLEET_TOKEN: ${VE_IOT_FLEET_TOKEN:-}
      # Minutes, not seconds: this maps connections to gateways, and that
      # mapping changes when somebody adds a connection.
      VE_IOT_FLEET_SYNC_SEC: ${VE_IOT_FLEET_SYNC_SEC:-300}
      VE_READINGS_TENANT_MAP: ${VE_READINGS_TENANT_MAP:-}
      VE_READINGS_DEFAULT_TENANT_ID: ${VE_READINGS_DEFAULT_TENANT_ID:-}
      # ── a hung database must not look healthy ──────────────────────────────
      # Two halves of the same failure, because neither covers the other:
      #
      #   VE_DB_STATEMENT_TIMEOUT_MS — a server-side ceiling on every query this
      #     service runs. A write blocked on a lock used to hang indefinitely;
      #     now it RAISES, which the existing retry/NAK path already handles and
      #     the health flag already reflects. Generous (60s) because the same
      #     engine serves the BI query API.
      #   VE_READINGS_WRITE_STALL_SEC — a client-side watchdog. `docker
      #     compose pause postgres` SIGSTOPs the server, so its own statement
      #     timeout is frozen and never fires; only the client can notice that a
      #     write has been in flight far too long. It does not cancel anything
      #     (nothing is acked, so nothing is lost) — it turns /readyz red so the
      #     silence is visible. Deliberately well under the statement timeout.
      VE_DB_STATEMENT_TIMEOUT_MS: ${VE_DB_STATEMENT_TIMEOUT_MS:-60000}
      VE_READINGS_WRITE_STALL_SEC: ${VE_READINGS_WRITE_STALL_SEC:-20}
      # ── retirement: when a point stops counting ────────────────────────────
      # A point that stops reporting used to count toward every Building
      # Intelligence figure forever, and the only way out was to DELETE the
      # dimension row — which orphans its readings. A point whose last_seen_at is
      # older than this is treated as retired at QUERY TIME (nothing is written,
      # nothing is deleted) and drops out of the counts; it returns the instant a
      # reading arrives. 0 disables the horizon and leaves only explicit
      # retirement via POST /bi/points/{id}/retire.
      VE_READINGS_RETIRE_AFTER_DAYS: ${VE_READINGS_RETIRE_AFTER_DAYS:-30}
      # ── observability ──────────────────────────────────────────────────────
      VE_READINGS_LAG_WARN: ${VE_READINGS_LAG_WARN:-10000}
      # ── dashboard datasets → core's permission catalog ─────────────────────
      # A dataset is registered as DATA and names the permission needed to read
      # it. This service publishes those keys to core so a ROLE CAN GRANT THEM;
      # without it only a wildcard admin could ever open the dataset (the
      # ingest.read bug). Best-effort — core being down never fails a chart.
      VE_CORE_URL: ${VE_CORE_URL:-http://core:8000}
      # ── the projection consumers (app/projections) ─────────────────────────
      # Every knob below was `reporting-projector`'s and is deliberately still
      # named VE_PROJECTOR_*: they configure the projection half and nothing
      # else, and a rename would silently reset a deployment that had tuned them
      # in deploy/.env. They stay SEPARATE from the VE_READINGS_* pair above —
      # sharing one lag threshold or one batch size between a sensor feed and a
      # door swipe is how one consumer's health starts standing in for the
      # other's.
      #
      # Batching: flush on N rows or T ms, whichever comes first. Smaller than
      # the reading-writer's 500 on purpose — domain events arrive at human
      # rates, so the timer is what fires and a bigger row threshold would only
      # delay a swipe reaching the store.
      VE_PROJECTOR_BATCH_ROWS: ${VE_PROJECTOR_BATCH_ROWS:-200}
      VE_PROJECTOR_BATCH_MS: ${VE_PROJECTOR_BATCH_MS:-1000}
      VE_PROJECTOR_QUEUE_BATCHES: ${VE_PROJECTOR_QUEUE_BATCHES:-4}
      # Ack only after the batch is durably written.
      VE_PROJECTOR_ACK_WAIT_SEC: ${VE_PROJECTOR_ACK_WAIT_SEC:-120}
      VE_PROJECTOR_MAX_ACK_PENDING: ${VE_PROJECTOR_MAX_ACK_PENDING:-2000}
      # How fast a newly-inserted projection starts being collected.
      VE_PROJECTOR_RELOAD_SEC: ${VE_PROJECTOR_RELOAD_SEC:-30}
      # Set to 0 in a deployment where the projected relations are managed out of
      # band; the projections then write only into relations that already exist.
      VE_PROJECTOR_ENSURE_RELATIONS: ${VE_PROJECTOR_ENSURE_RELATIONS:-1}
      # A system-scoped event's subject segment is the literal `platform`, which
      # is not a uuid, and the projected relations declare `tenant_id uuid NOT
      # NULL`. Map it, or unmapped keys get a stable synthetic UUID and a loud
      # warning. Same three rules (and the same namespace) as the readings half,
      # and unset it falls back to VE_READINGS_TENANT_MAP — see app/projections/
      # config.py for why that fallback is deliberate rather than lazy.
      VE_PROJECTOR_TENANT_MAP: ${VE_PROJECTOR_TENANT_MAP:-}
      VE_PROJECTOR_DEFAULT_TENANT_ID: ${VE_PROJECTOR_DEFAULT_TENANT_ID:-}
      # Its own stall watchdog and its own lag threshold, reported and paged on
      # separately from the readings ones. VE_DB_STATEMENT_TIMEOUT_MS above is
      # the server-side half and covers both halves' queries.
      VE_PROJECTOR_WRITE_STALL_SEC: ${VE_PROJECTOR_WRITE_STALL_SEC:-20}
      VE_PROJECTOR_LAG_WARN: ${VE_PROJECTOR_LAG_WARN:-5000}
      # ── the projections' OWN connection pool ───────────────────────────────
      # NOT tuning. This is what stops a projection holding connections from
      # blocking the readings write loop in the pool checkout, where no
      # statement_timeout applies and no health flag is armed — the one thing
      # two separate containers gave for free. See app/projections/db.py.
      VE_PROJECTOR_POOL_SIZE: ${VE_PROJECTOR_POOL_SIZE:-4}
      VE_PROJECTOR_POOL_OVERFLOW: ${VE_PROJECTOR_POOL_OVERFLOW:-4}
    depends_on:
      postgres: { condition: service_healthy }
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_started }
      reporting-migrate: { condition: service_completed_successfully }
    # /health, /readyz, /metrics, /stats. Deliberately NOT behind Traefik: this is
    # an operational surface, not a tenant API — and for the same reason it is
    # published for DEVELOPMENT ONLY, from docker-compose.override.yml. An
    # appliance runs this file alone, where publishing it would put an unauthed
    # operational surface on the customer's LAN.
    restart: unless-stopped
    # /readyz, not /health. /health is 200 while the process is up; /readyz turns
    # 503 when either NATS consumer is wedged — which is the failure that matters
    # here, because a wedged consumer silently stops storing readings while the
    # container still looks fine. It was written and nothing consumed it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/readyz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    networks: [neubit]

  # ── operator console (Next.js) ──────────────────────────────────
  frontend:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # PRODUCTION `node server.js` — the standalone runner this file builds, which
    # measures ~115 MB like the admin console. 1g is generous for it on purpose:
    # Next's server-side render path allocates per request. THE DEV OVERRIDE
    # RAISES THIS to 4g, because `next dev` with webpack measured 2.5 GB on a
    # live machine and this limit would OOM-kill it on the first `up`.
    mem_limit: 1g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    # PRODUCTION by default: builds the standalone runner image (node server.js).
    #
    # START THE LOCAL STACK AS `docker compose up -d` FROM THIS DIRECTORY, never as
    # `docker compose -f deploy/docker-compose.yml ...` from the repo root. Naming a
    # file with -f DISABLES compose's automatic merge of docker-compose.override.yml,
    # and the override is the only thing that pins this service to the `:dev` tag.
    # Without it compose reuses whatever sits on `neubit-v3-frontend:latest` — which
    # on a machine that has ever run the dev build is the DEPS STAGE: CMD=[node], no
    # server.js, exits 0 immediately, restart loop, console never comes up. Observed,
    # not theorised. The override's own comment explains the tag; this explains how
    # you end up bypassing it.
    # The dev override adds the bind-mount + `npm run dev` for hot-reload.
    build: ../frontend
    # NOT `env_file: .env`. The Next.js server reads NEXT_PUBLIC_API_URL and
    # nothing else from it (grep: process.env in frontend/src and next.config),
    # while the blanket env_file handed the browser-facing server the estate's
    # token-signing key, its secrets key and every third-party credential in the
    # file. Least privilege: name what it uses.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on: [core]
    networks: [neubit]
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000

  # ── offline basemap tiles ───────────────────────────────────────
  # Serves the self-hosted PMTiles world archive the Sites Map draws when Google
  # Maps is off (the default). SELF-PROVISIONING: on first start, if deploy/tiles/
  # holds no archive, the container extracts one from the Protomaps planet in the
  # background — `docker compose up` is the only command anyone has to run.
  #
  # The extract is a multi-GB download, so nginx serves from the first second and
  # the map simply fills in when the archive lands. Until then (and on an
  # air-gapped host with no archive at all) the console shows a "basemap not
  # installed" panel; nothing else is affected.
  #
  #   TILES_MAXZOOM   detail vs size — z8=543MB · z10=3.7GB · z12=17GB · z15=137GB
  #   TILES_AUTO_PROVISION=0   never download; serve only what is already in
  #                            deploy/tiles/ (the air-gapped setting)
  tiles:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # nginx at 3 MB idle, plus the self-provisioner, which is the actual reason
    # this is not 128m: a pmtiles extract of a multi-GB planet archive runs in
    # this container. It streams, so 512m is the buffer ceiling, not the
    # archive size.
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build: ./tiles-server
    environment:
      TILES_MAXZOOM: ${TILES_MAXZOOM:-10}
      TILES_AUTO_PROVISION: ${TILES_AUTO_PROVISION:-1}
    volumes:
      - ./tiles:/data
    networks: [neubit]
    # Routed by the gateway's FILE provider (gateway/dynamic/routes.yml), not by
    # Docker labels — the label provider is off in gateway/traefik.yml.

  # Offline address geocoder — Photon over a prebuilt OpenStreetMap index, so the
  # site-form map picker can find a street or a building without asking anyone.
  #
  #   GEOCODER_COUNTRY      ISO code of the extract to serve (default "in").
  #                         graphhopper publishes one per country.
  #   GEOCODER_AUTO_PROVISION=0   never download; serve only what is already in
  #                               deploy/geocoder/ (the air-gapped setting)
  #
  # The index is a few GB and Photon reads it at startup, so this service takes
  # minutes to become useful on a cold volume. Nothing else waits on it: the
  # picker falls back to its built-in city list until it answers.
  geocoder:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # Photon, a JVM over a multi-GB OpenStreetMap index — 239 MB idle and the
    # largest non-datastore in the estate. Sized from what it is CONFIGURED to
    # take, not what it is taking: a modern JVM reads the cgroup limit and takes
    # ~25% of it as max heap, so this limit is what SETS the heap at ~512 MB,
    # which is what a country extract needs. Lowering it silently shrinks the
    # heap until Photon starts GC-thrashing on a query.
    mem_limit: 2g
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    build: ./geocoder-server
    environment:
      GEOCODER_COUNTRY: ${GEOCODER_COUNTRY:-in}
      GEOCODER_AUTO_PROVISION: ${GEOCODER_AUTO_PROVISION:-1}
    volumes:
      - ./geocoder:/data
    networks: [neubit]
    # Routed by the gateway's FILE provider (gateway/dynamic/routes.yml), like tiles.

  # ── super-admin panel (separate app) ────────────────────────────
  admin-frontend:
    # Log rotation + a memory ceiling — see the x-logging anchor and the memory
    # tiers at the top of this file for why every service carries both.
    logging: *logging
    # PRODUCTION standalone runner, 115 MB idle. The dev override raises it —
    # same reason as the frontend above.
    mem_limit: 512m
    # Comes back on its own after a host reboot or a Docker restart. Without
    # this the whole estate stays down until somebody runs `up -d` by hand —
    # and the symptom is a bare "Bad gateway", which reads as a broken build.
    restart: unless-stopped
    # PRODUCTION by default (standalone runner). API base is same-origin relative
    # (served on admin.localhost → /api/v1 via the gateway), so no host is baked in.
    # The dev override adds the bind-mount + `npm run dev` for hot-reload.
    build: ../admin-frontend
    depends_on: [core]
    networks: [neubit]
