# NATS server configuration — authentication for the event spine.
#
# WHAT THIS CHANGED
# -----------------
# The broker ran with no auth at all: `nats -js -sd /data -m 8222`. Anything that
# could reach port 4222 could publish any subject on any tenant, consume any
# stream, and delete any durable consumer. The kernel's README said so
# ("NATS runs with NO AUTHENTICATION ... a compromised service can publish a
# well-formed offboard") and it stayed true because turning it on is a deployment
# change, not a code one.
#
# Every client now presents a user. `no_auth_user` is deliberately NOT set, so an
# unauthenticated connection is refused rather than silently downgraded.
#
# WHAT IT DOES AND DOES NOT STOP
# ------------------------------
# Publish permissions are scoped per service, so `access` cannot publish as
# `vms`, and a compromised reading-writer cannot publish anything at all — it only
# consumes. That is the property worth having and it is now enforced.
#
# `ingest` is the exception and it is structural, not an oversight. A tenant's
# ingest RULE carries `target_domain`, which is interpolated into the subject, so
# the domain is chosen by configuration rather than by code. Scoping ingest to a
# fixed list would break a legitimate rule the moment somebody added one. Its
# grant is therefore `tenant.*.*.>` and the control for "an ingest rule naming
# another module's word" has to stay in the permission model, not here.
#
# JETSTREAM'S API IS SCOPED PER STREAM. Each service is granted the API subjects
# for the streams it actually uses and no others: core ensures and publishes to
# EVENTS; the four satellites ensure EVENTS and EVENTS_DLQ through the kernel's
# bus and consume EVENTS; reading-writer consumes all three; the edge collector
# publishes readings and asserts IOT_READINGS.
#
# Two patterns per stream, because the stream token is not always in the same
# place: `$JS.API.CONSUMER.*.<stream>` covers CREATE/LIST/NAMES (stream at 5) and
# `$JS.API.CONSUMER.*.*.<stream>.>` covers DURABLE.CREATE and MSG.NEXT (stream at
# 6). The trailing `>` is there because a CREATE with a filter carries the filter
# subject — dots and all — in the API subject.
#
# What is NOT scopable is per-DURABLE, and that is a property of the subject
# space rather than a decision: a durable name is one token and NATS has no
# partial-token wildcard, so scoping consumer operations to a service's own
# durables would mean naming every durable in the estate and having a new one fail
# silently. Per-stream is where the line falls cleanly, and it means a compromised
# access cannot touch IOT_READINGS at all.
#
# `$JS.API.STREAM.NAMES` is granted unscoped because it CANNOT be scoped: it
# carries no stream token. nats-py calls it to resolve which stream a subject
# belongs to before binding a consumer, so without it every satellite fails at
# subscribe — which is exactly how it was found, named in one log line rather than
# discovered as a silent outage. It is a lookup and returns names, not data.
#
# `$JS.API.>` on the SUBSCRIBE side is gone entirely: an API reply comes back on
# the requester's own `_INBOX`, so nothing ever needed to subscribe to the API
# tree. It was granted because it looked symmetrical.
#
# NOTHING may DELETE OR PURGE A STREAM. Every service is denied
# `$JS.API.STREAM.DELETE.>` and `$JS.API.STREAM.PURGE.>`, which is the one part of
# the JetStream API that can be split off without guesswork: no code in the estate
# calls either, so denying them costs nothing and takes "a compromised service can
# drop the readings stream" off the table. Checked before denying —
# vision's `purge()` is a database row sweep, not a stream purge.
#
# CONSUMER delete is NOT denied, and that is not an oversight. Two callers rely on
# it and both are recreating THEIR OWN durable: a projection whose spec's filter
# changed, and the kernel replacing a legacy never-acking consumer. Scoping consumer
# ops per durable is not expressible here either — a durable name is one subject
# token and NATS has no partial-token wildcard, so it would mean listing every
# durable in the estate and having a new one fail silently.
#
# `$JS.ACK.<stream>.>` IS A DIFFERENT TREE FROM `$JS.API.>` and every CONSUMER
# needs it — scoped to the streams that service consumes, on the same reasoning as
# the API above. `core` publishes and consumes nothing, so it is granted none.
#
# `$JS.ACK.>` IS A DIFFERENT TREE FROM `$JS.API.>` and every CONSUMER needs it.
# A durable ack is published to `$JS.ACK.<stream>.<durable>.…`, so granting only
# the API leaves consumers able to fetch and unable to confirm: messages are
# redelivered forever, the writer's ON CONFLICT DO NOTHING makes each redelivery
# a no-op, and the pipeline reports healthy while the newest reading stops
# advancing. Measured, not guessed — that is what happened on the first flip.
# Publishers (conflux) do not ack and are not granted it.
#
# CREDENTIALS
# -----------
# Passwords come from the environment via `include`-free interpolation: NATS
# expands $VAR at parse time. They are set per service in docker-compose.yml and
# carried in deploy/.env, which is gitignored — so this file names no secret.

jetstream {
  store_dir: "/data"
}

http: 8222

authorization {
  users: [
    # ── the platform authority. Mints tokens, owns tenants, sites, tags. ─
    { user: "core", password: $NATS_PASS_CORE, permissions: {
        publish: { allow: ["tenant.*.core.>", "tenant.*.tenant.>", "tenant.*.sites.>", "tenant.*.tags.>", "tenant.*.erasure.>", "tenant.*.device.>", "tenant.*.vms.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── access control. Publishes door/controller events, consumes lifecycle. ─
    { user: "access", password: $NATS_PASS_ACCESS, permissions: {
        publish: { allow: ["tenant.*.access.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>", "$JS.API.STREAM.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ.>", "$JS.API.CONSUMER.*.*.EVENTS_DLQ.>", "$JS.ACK.EVENTS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── the inbound trust boundary. Its domain is TENANT-CONFIGURED (a rule's
    #    target_domain is interpolated into the subject), so the grant cannot be a
    #    fixed list without breaking a legitimate rule. See the note above. ─
    { user: "ingest", password: $NATS_PASS_INGEST, permissions: {
        # `tenant.*.*.>` with the other services' domains DENIED. The allow has to
        # be open because a rule's `target_domain` is tenant-configured and is
        # interpolated into the subject — a fixed list would break a legitimate
        # rule the moment somebody added one. What can be stated is the other half:
        # the ten domains another service is the AUTHORITY for. ingest refuses them
        # where a rule is saved (app/ingest/schemas.py::RESERVED_DOMAINS); this is
        # the same rule at the broker, so a row written straight to the column, or
        # a bug that skips the schema, still cannot emit as access control.
        # Keep the two lists in step — backend/ingest/tests/test_target_domain_ownership.py
        # asserts they match.
        publish: { allow: ["tenant.*.*.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>", "$JS.API.STREAM.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ.>", "$JS.API.CONSUMER.*.*.EVENTS_DLQ.>", "$JS.ACK.EVENTS.>"], deny: [
          "$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>",
          "tenant.*.access.>", "tenant.*.core.>", "tenant.*.device.>",
          "tenant.*.erasure.>", "tenant.*.notify.>", "tenant.*.sites.>",
          "tenant.*.tags.>", "tenant.*.tenant.>", "tenant.*.vms.>",
          "tenant.*.workflow.>"
        ] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── cameras and recorders. ─
    { user: "vision", password: $NATS_PASS_VISION, permissions: {
        publish: { allow: ["tenant.*.vms.>", "tenant.*.device.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>", "$JS.API.STREAM.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ.>", "$JS.API.CONSUMER.*.*.EVENTS_DLQ.>", "$JS.ACK.EVENTS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── correlation, incidents, notifications. ─
    { user: "workflow", password: $NATS_PASS_WORKFLOW, permissions: {
        publish: { allow: ["tenant.*.workflow.>", "tenant.*.notify.>", "tenant.*.fire.>", "dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>", "$JS.API.STREAM.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ.>", "$JS.API.CONSUMER.*.*.EVENTS_DLQ.>", "$JS.ACK.EVENTS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── the reporting writer. CONSUMES ONLY — readings, projections, the two site
    #    mirrors, the DLQ watch and the tenant offboard. It publishes no domain
    #    event, so it is granted none: the tightest user here, and the one whose
    #    process holds the most data. ─
    { user: "reading-writer", password: $NATS_PASS_READING_WRITER, permissions: {
        publish: { allow: ["dlq.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS", "$JS.API.CONSUMER.*.EVENTS.>", "$JS.API.CONSUMER.*.*.EVENTS.>", "$JS.API.STREAM.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ", "$JS.API.CONSUMER.*.EVENTS_DLQ.>", "$JS.API.CONSUMER.*.*.EVENTS_DLQ.>", "$JS.API.STREAM.*.IOT_READINGS", "$JS.API.CONSUMER.*.IOT_READINGS", "$JS.API.CONSUMER.*.IOT_READINGS.>", "$JS.API.CONSUMER.*.*.IOT_READINGS.>", "$JS.ACK.EVENTS.>", "$JS.ACK.EVENTS_DLQ.>", "$JS.ACK.IOT_READINGS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["tenant.>", "dlq.>", "_INBOX.>"] }
    } },

    # ── the edge collector (a SEPARATE deployment: conflux). Readings and device
    #    alerts, and nothing else. It is the only client outside this compose
    #    project, so its grant is the one that matters most. A PUBLISHER, so it
    #    never acks and is not granted $JS.ACK.>.
    { user: "conflux-edge", password: $NATS_PASS_CONFLUX, permissions: {
        publish: { allow: ["tenant.*.iot.>", "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.*.IOT_READINGS", "$JS.API.CONSUMER.*.IOT_READINGS", "$JS.API.CONSUMER.*.IOT_READINGS.>", "$JS.API.CONSUMER.*.*.IOT_READINGS.>"], deny: ["$JS.API.STREAM.DELETE.>", "$JS.API.STREAM.PURGE.>"] },
        subscribe: { allow: ["_INBOX.>"] }
    } }
  ]
}
